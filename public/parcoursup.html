                  </div>
                  <div className="kpi-card kpi-card-accent" style={{ borderLeftColor: '#F39C12' }}>
                    <div className="label">Total relances</div>
                    <div className="value">{d.relancesTotal}</div>
                  </div>
                  <div className="kpi-card kpi-card-accent" style={{ borderLeftColor: '#E74C3C' }}>
                    <div className="label">Sans relance</div>
                    <div className="value" style={{ color: d.sansRelance > 0 ? '#E74C3C' : '#2ECC71' }}>{d.sansRelance}</div>
                    <div className="sub">{d.totalCandidats > 0 ? Math.round((d.sansRelance / d.totalCandidats) * 100) : 0}% non traités</div>
                  </div>
                  <div className="kpi-card kpi-card-accent" style={{ borderLeftColor: '#9B59B6' }}>
                    <div className="label">CRM</div>
                    <div className="value" style={{ color: '#9B59B6' }}>{d.crmCount} <span style={{ fontSize: 13, color: '#aaa' }}>({d.tauxCRM}%)</span></div>
                  </div>
                  <div className="kpi-card" style={{ background: 'linear-gradient(135deg, #d5f5e3 0%, #eafaf1 100%)' }}>
                    <div className="label" style={{ color: '#1e8449' }}>Inscrits</div>
                    <div className="value" style={{ color: '#27ae60' }}>{d.inscritCount} <span style={{ fontSize: 13, color: '#1e8449' }}>({d.tauxInscrit}%)</span></div>
                  </div>
                </div>

                <div className="charts-grid">
                  <div className="chart-container">
                    <h3><span className="chart-icon">&#x1F4C5;</span> 7 derniers jours</h3>
                    <ChartComponent
                      type="bar"
                      height={250}
                      data={{
                        labels: Object.keys(d.last7Days).map(k => {
                          const dt = new Date(k);
                          const days = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
                          return days[dt.getDay()] + ' ' + dt.getDate() + '/' + (dt.getMonth()+1);
                        }),
                        datasets: [{
                          label: 'Actions',
                          data: Object.values(d.last7Days),
                          backgroundColor: Object.values(d.last7Days).map(v => v > 0 ? color : '#eef0f4'),
                          borderRadius: 8, borderSkipped: false, barPercentage: 0.6,
                        }]
                      }}
                      options={{
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: '#f0f2f5' } }, x: { grid: { display: false } } }
                      }}
                    />
                  </div>

                  <div className="chart-container">
                    <h3><span className="chart-icon">&#x1F4DE;</span> Canaux utilisés</h3>
                    <ChartComponent
                      type="doughnut"
                      height={250}
                      data={{
                        labels: config.relanceTypes.map(t => t.label),
                        datasets: [{
                          data: config.relanceTypes.map(t => d.actionsByType[t.id] || 0),
                          backgroundColor: ['#3498DB', '#E74C3C', '#25D366', '#9B59B6', '#F39C12'],
                          borderWidth: 3, borderColor: '#fff', hoverBorderWidth: 0,
                        }]
                      }}
                      options={{ cutout: '55%', plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, pointStyle: 'circle', padding: 14, font: { size: 12, weight: '600' } } } } }}
                    />
                  </div>

                  <div className="chart-container">
                    <h3><span className="chart-icon">&#x25B6;</span> Pipeline de {selectedCharge}</h3>
                    <div style={{ padding: '4px 0' }}>
                      {config.stages.map(s => {
                        const count = d.pipeline[s.id] || 0;
                        const pct = maxIndivPipeline > 0 ? (count / maxIndivPipeline) * 100 : 0;
                        return (
                          <div key={s.id} className="funnel-bar">
                            <div className="funnel-label">{s.label}</div>
                            <div className="funnel-track">
                              <div className="funnel-fill" style={{ width: `${Math.max(pct, count > 0 ? 10 : 0)}%`, background: s.color }}>
                                {count > 0 && <span>{count}</span>}
                              </div>
                            </div>
                            <div className="funnel-count">{count}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="chart-container">
                    <h3><span className="chart-icon">&#x23F1;</span> Temps moyen 1ère relance</h3>
                    {Object.keys(d.tempsTraitement).length > 0 ? (
                      <div style={{ padding: '4px 0' }}>
                        {config.stages.filter(s => d.tempsTraitement[s.id] !== undefined).map(s => {
                          const t = d.tempsTraitement[s.id];
                          const max = Math.max(...Object.values(d.tempsTraitement), 1);
                          const pct = (t / max) * 100;
                          return (
                            <div key={s.id} className="funnel-bar">
                              <div className="funnel-label">{s.label}</div>
                              <div className="funnel-track">
                                <div className="funnel-fill" style={{ width: `${Math.max(pct, 10)}%`, background: s.color + 'CC' }}>
                                  <span>{formatHours(t)}</span>
                                </div>
                              </div>
                              <div className="funnel-count" style={{ fontSize: 12 }}>{formatHours(t)}</div>
                            </div>
                          );
                        })}
                      </div>
                    ) : (
                      <div style={{ padding: 40, textAlign: 'center', color: '#aaa', fontSize: 13 }}>Pas encore assez de données</div>
                    )}
                  </div>
                </div>
              </>
            );
          })()}
        </div>
      );
    }

    // ============ DUPLICATES VIEW ============
    function DuplicatesView({ duplicates, config, onMerge, onRefresh }) {
      return (
        <div className="duplicates-view">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
            <div>
              <h2 style={{ fontSize: 20 }}>Doublons détectés</h2>
              <p style={{ color: '#888', fontSize: 13, marginTop: 4 }}>{duplicates.total} groupe(s) de doublons identifiés (basé sur nom + email + téléphone)</p>
            </div>
            <button className="btn btn-outline" onClick={onRefresh}>
              <Icon name="refresh-cw" size={16} /> Rafraîchir
            </button>
          </div>

          {duplicates.groups.length === 0 && (
            <div style={{ padding: 60, textAlign: 'center', color: '#aaa' }}>
              <Icon name="check" size={40} color="#2ECC71" />
              <p style={{ marginTop: 12, fontSize: 16 }}>Aucun doublon détecté</p>
            </div>
          )}

          {duplicates.groups.map((group, gi) => (
            <div key={gi} className="dup-group">
              <h3><Icon name="alert-triangle" size={16} /> Groupe de {group.length} doublons</h3>
              {group.map(c => {
                const ecoleColor = config.ecoles[c.ecole]?.color || '#999';
                const stageInfo = config.stages.find(s => s.id === c.stage);
                return (
                  <div key={c.id} className="dup-candidate">
                    <div className="info">
                      <strong>{c.prenom} {c.nom}</strong>
                      <span className="ecole-badge" style={{ background: ecoleColor, marginLeft: 8 }}>{c.ecole}</span>
                      <span style={{ marginLeft: 8 }}>{c.formation}</span>
                      <span style={{ marginLeft: 8, color: '#888' }}>{c.email} | {c.telephone}</span>
                      <span className="stage-badge" style={{ background: stageInfo?.color || '#999', marginLeft: 8 }}>{stageInfo?.label}</span>
                    </div>
                    <button
                      className="btn btn-sm btn-success"
                      onClick={() => {
                        const removeIds = group.filter(x => x.id !== c.id).map(x => x.id);
                        onMerge(c.id, removeIds);
                      }}
                    >
                      Garder celui-ci
                    </button>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      );
    }

    // ============ FORMATIONS VIEW ============
    // Onglet de gestion des formations CLEM : CRUD + PJ standards (programme, calendrier, fiche produit)
    // + zone "Autres documents" libre. Les PJ sont stockées sur le serveur dans data/formations/<slug>/.
    function FormationsView({ api, onConfigReload }) {
      const [formations, setFormations] = useState([]);
      const [loading, setLoading] = useState(true);
      const [editing, setEditing] = useState(null); // null | { mode: 'create' | 'edit', formation: {...} }
      const [error, setError] = useState(null);

      const load = useCallback(async () => {
        setLoading(true);
        try {
          const r = await api('/formations');
          setFormations(r.formations || []);
          setError(null);
        } catch (e) { setError('Erreur de chargement : ' + (e.message || e)); }
        setLoading(false);
      }, [api]);

      useEffect(() => { load(); }, [load]);

      const handleDelete = async (name) => {
        if (!confirm(`Supprimer la formation "${name}" et toutes ses pièces jointes ?`)) return;
        await api('/formations/' + encodeURIComponent(name), { method: 'DELETE' });
        await load();
        if (onConfigReload) onConfigReload();
      };

      const NIVEAU_COLORS = {
        'Bac': '#94a3b8', 'Bac+2': '#3b82f6', 'Bac+3': '#8b5cf6',
        'Bac+4': '#ec4899', 'Bac+5': '#f59e0b', 'Pro': '#10b981'
      };

      if (loading) return <div style={{ padding: 40, textAlign: 'center', color: '#888' }}>Chargement des formations...</div>;

      return (
        <div style={{ padding: 24 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
            <h2 style={{ fontSize: 22, fontWeight: 800, fontFamily: 'Inter Tight, Inter, sans-serif' }}>
              Formations <span style={{ color: '#94a3b8', fontWeight: 600, fontSize: 16 }}>({formations.length})</span>
            </h2>
            <button className="btn btn-primary" onClick={() => setEditing({ mode: 'create', formation: {} })}>
              <Icon name="plus" size={14} /> Nouvelle formation
            </button>
          </div>

          {error && <div style={{ background: '#fee2e2', color: '#991b1b', padding: 12, borderRadius: 8, marginBottom: 16, fontSize: 13 }}>{error}</div>}

          {formations.length === 0 ? (
            <div style={{ background: 'white', padding: 60, borderRadius: 12, textAlign: 'center', color: '#94a3b8' }}>
              <Icon name="book" size={40} color="#cbd5e1" />
              <p style={{ marginTop: 16, fontSize: 14 }}>Aucune formation pour le moment.</p>
              <p style={{ fontSize: 13 }}>Cliquez sur "Nouvelle formation" pour commencer.</p>
            </div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: 16 }}>
              {formations.map(f => {
                const pjCount = Object.keys(f.attachments || {}).length + (f.autresDocs || []).length;
                const niveauColor = NIVEAU_COLORS[f.niveau] || '#64748b';
                return (
                  <div key={f.name} style={{ background: 'white', borderRadius: 12, padding: 18, boxShadow: '0 1px 3px rgba(0,0,0,0.05)', border: '1px solid #e2e8f0', cursor: 'pointer', transition: 'all 0.2s' }}
                    onMouseEnter={e => e.currentTarget.style.boxShadow = '0 4px 12px rgba(0,0,0,0.08)'}
                    onMouseLeave={e => e.currentTarget.style.boxShadow = '0 1px 3px rgba(0,0,0,0.05)'}
                    onClick={() => setEditing({ mode: 'edit', formation: f })}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
                      <div style={{ flex: 1 }}>
                        <h3 style={{ fontSize: 16, fontWeight: 800, color: '#0f172a', fontFamily: 'Inter Tight, Inter, sans-serif', lineHeight: 1.2 }}>{f.name}</h3>
                        {f.libelle && <div style={{ fontSize: 12, color: '#64748b', marginTop: 4 }}>{f.libelle}</div>}
                      </div>
                      {f.niveau && (
                        <span style={{ background: niveauColor + '22', color: niveauColor, fontSize: 11, fontWeight: 700, padding: '3px 8px', borderRadius: 8, whiteSpace: 'nowrap' }}>{f.niveau}</span>
                      )}
                    </div>
                    {f.rncp && (
                      <div style={{ fontSize: 11, color: '#94a3b8', marginTop: 6 }}>
                        <strong>RNCP :</strong> {f.rncp}
                      </div>
                    )}
                    <div style={{ display: 'flex', gap: 8, marginTop: 12, flexWrap: 'wrap', alignItems: 'center' }}>
                      <span style={{ fontSize: 11, color: '#64748b', background: '#f1f5f9', padding: '3px 8px', borderRadius: 6 }}>
                        📎 {pjCount} {pjCount > 1 ? 'pièces' : 'pièce'}
                      </span>
                      {f.franceCompetencesUrl && (
                        <span style={{ fontSize: 11, color: '#0369a1', background: '#e0f2fe', padding: '3px 8px', borderRadius: 6 }}>
                          🔗 France Compétences
                        </span>
                      )}
                      {f.conseiller && (
                        <span style={{ fontSize: 11, color: '#64748b' }}>
                          Conseiller : <strong>{f.conseiller}</strong>
                        </span>
                      )}
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 12, gap: 8 }} onClick={e => e.stopPropagation()}>
                      <button className="btn btn-sm btn-outline" onClick={() => setEditing({ mode: 'edit', formation: f })}>
                        <Icon name="edit" size={12} /> Éditer
                      </button>
                      <button className="btn btn-sm" style={{ background: '#fee2e2', color: '#991b1b', border: 'none' }} onClick={() => handleDelete(f.name)}>
                        <Icon name="trash" size={12} />
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {editing && (
            <FormationEditor
              mode={editing.mode}
              formation={editing.formation}
              api={api}
              onClose={() => setEditing(null)}
              onSaved={async () => { await load(); if (onConfigReload) onConfigReload(); }}
            />
          )}
        </div>
      );
    }

    // ============ FORMATION EDITOR MODAL ============
    function FormationEditor({ mode, formation, api, onClose, onSaved }) {
      const isEdit = mode === 'edit';
      const [form, setForm] = useState({
        name: formation.name || '',
        libelle: formation.libelle || '',
        niveau: formation.niveau || '',
        rncp: formation.rncp || '',
        franceCompetencesUrl: formation.franceCompetencesUrl || '',
        conseiller: formation.conseiller || ''
      });
      const [attachments, setAttachments] = useState(formation.attachments || {});
      const [autresDocs, setAutresDocs] = useState(formation.autresDocs || []);
      const [saving, setSaving] = useState(false);
      const [uploading, setUploading] = useState(null); // type en cours d'upload
      const [error, setError] = useState(null);
      const [newOtherLabel, setNewOtherLabel] = useState('');

      const NIVEAUX = ['Bac', 'Bac+2', 'Bac+3', 'Bac+4', 'Bac+5', 'Pro'];
      const PJ_LABELS = { programme: 'Programme', calendrier: 'Calendrier de formation', ficheProduit: 'Fiche produit' };

      const handleChange = (field, value) => setForm(f => ({ ...f, [field]: value }));

      const handleSave = async () => {
        if (!form.name.trim()) { setError('Le nom est requis'); return; }
        setSaving(true); setError(null);
        try {
          if (isEdit) {
            const r = await api('/formations/' + encodeURIComponent(formation.name), { method: 'PUT', body: form });
            if (r.error) throw new Error(r.error);
          } else {
            const r = await api('/formations', { method: 'POST', body: form });
            if (r.error) throw new Error(r.error);
          }
          await onSaved();
          onClose();
        } catch (e) {
          setError(e.message || 'Erreur lors de la sauvegarde');
        }
        setSaving(false);
      };

      // Upload d'un fichier (PJ standard ou autre doc) — utilise fetch direct car multipart/form-data
      const uploadFile = async (type, file, label) => {
        if (!isEdit) { setError('Sauvegardez d\'abord la formation avant d\'ajouter des PJ.'); return; }
        if (!file) return;
        if (file.size > 20 * 1024 * 1024) { setError('Fichier trop volumineux (max 20 Mo)'); return; }
        if (!file.name.toLowerCase().endsWith('.pdf')) { setError('Seuls les PDF sont acceptés'); return; }
        setUploading(type + (label || '')); setError(null);
        try {
          const fd = new FormData();
          fd.append('file', file);
          if (label) fd.append('label', label);
          const url = '/parcoursup/api/formations/' + encodeURIComponent(formation.name) + '/upload/' + type;
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + getToken() },
            body: fd
          });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || 'Upload échoué');
          setAttachments(data.attachments || {});
          setAutresDocs(data.autresDocs || []);
          await onSaved();
        } catch (e) {
          setError(e.message || 'Erreur upload');
        }
        setUploading(null);
      };

      const deleteAttachment = async (type, id) => {
        if (!confirm('Supprimer cette pièce jointe ?')) return;
        try {
          const url = '/formations/' + encodeURIComponent(formation.name) + '/attachment/' + type + (id ? '/' + id : '');
          await api(url, { method: 'DELETE' });
          if (type === 'autre') {
            setAutresDocs(docs => docs.filter(d => d.id !== id));
          } else {
            setAttachments(a => { const cp = { ...a }; delete cp[type]; return cp; });
          }
          await onSaved();
        } catch (e) { setError(e.message); }
      };

      // Téléchargement : fetch avec auth, blob, simulate download click
      const downloadAttachment = async (type, id, defaultName) => {
        try {
          const url = '/parcoursup/api/formations/' + encodeURIComponent(formation.name) + '/download/' + type + (id ? '/' + id : '');
          const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + getToken() } });
          if (!res.ok) throw new Error('Téléchargement échoué (' + res.status + ')');
          const blob = await res.blob();
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = defaultName || 'document.pdf';
          document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(blobUrl);
        } catch (e) { setError(e.message); }
      };

      const fmtSize = (s) => s < 1024 * 1024 ? Math.round(s / 1024) + ' Ko' : (s / 1024 / 1024).toFixed(1) + ' Mo';

      // Rendu d'une zone PJ standard (programme/calendrier/ficheProduit)
      const renderPJZone = (type) => {
        const att = attachments[type];
        const isUploading = uploading === type;
        return (
          <div style={{ background: '#f8fafc', borderRadius: 10, padding: 14, border: '1px solid #e2e8f0' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
              <strong style={{ fontSize: 13 }}>{PJ_LABELS[type]}</strong>
              {att && <span style={{ fontSize: 10, color: '#94a3b8' }}>{fmtSize(att.size || 0)}</span>}
            </div>
            {att ? (
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                <button className="btn btn-sm" style={{ background: '#DDE04B', color: '#111', border: '1.5px solid #111', flex: 1, fontWeight: 700 }} onClick={() => downloadAttachment(type, null, att.originalName)}>
                  <Icon name="download" size={12} /> Télécharger
                </button>
                <label className="btn btn-sm btn-outline" style={{ cursor: 'pointer', margin: 0 }}>
                  <Icon name="upload" size={12} /> Remplacer
                  <input type="file" accept="application/pdf,.pdf" style={{ display: 'none' }} onChange={e => uploadFile(type, e.target.files[0])} disabled={isUploading} />
                </label>
                <button className="btn btn-sm" style={{ background: '#fee2e2', color: '#991b1b', border: 'none' }} onClick={() => deleteAttachment(type, null)}>
                  <Icon name="trash" size={12} />
                </button>
              </div>
            ) : (
              <label className="btn btn-sm btn-outline" style={{ cursor: isEdit ? 'pointer' : 'not-allowed', width: '100%', justifyContent: 'center', opacity: isEdit ? 1 : 0.5 }}>
                {isUploading ? '⏳ Upload...' : <><Icon name="upload" size={12} /> Ajouter PDF</>}
                <input type="file" accept="application/pdf,.pdf" style={{ display: 'none' }} onChange={e => uploadFile(type, e.target.files[0])} disabled={!isEdit || isUploading} />
              </label>
            )}
          </div>
        );
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{ width: 760, maxHeight: '92vh' }}>
            <div className="modal-header">
              <h2 style={{ fontFamily: 'Inter Tight, Inter, sans-serif' }}>
                {isEdit ? 'Éditer la formation' : 'Nouvelle formation'}
              </h2>
              <button className="btn btn-icon btn-outline" onClick={onClose}><Icon name="x" size={18} /></button>
            </div>
            <div className="modal-body" style={{ maxHeight: '70vh', overflowY: 'auto' }}>
              {error && <div style={{ background: '#fee2e2', color: '#991b1b', padding: 12, borderRadius: 8, marginBottom: 16, fontSize: 13 }}>{error}</div>}

              <div className="form-row">
                <div className="form-group" style={{ flex: 2 }}>
                  <label>Nom de la formation *</label>
                  <input value={form.name} onChange={e => handleChange('name', e.target.value)} placeholder="Ex: BTS COMMUNICATION" autoFocus />
                </div>
                <div className="form-group">
                  <label>Niveau</label>
                  <select value={form.niveau} onChange={e => handleChange('niveau', e.target.value)}>
                    <option value="">-- Choisir --</option>
                    {NIVEAUX.map(n => <option key={n} value={n}>{n}</option>)}
                  </select>
                </div>
              </div>

              <div className="form-row">
                <div className="form-group">
                  <label>Libellé long</label>
                  <input value={form.libelle} onChange={e => handleChange('libelle', e.target.value)} placeholder="Ex: BTS Communication" />
                </div>
              </div>

              <div className="form-row">
                <div className="form-group">
                  <label>N° RNCP</label>
                  <input value={form.rncp} onChange={e => handleChange('rncp', e.target.value)} placeholder="Ex: RNCP38379" />
                </div>
                <div className="form-group">
                  <label>Conseiller en formation</label>
                  <input value={form.conseiller} onChange={e => handleChange('conseiller', e.target.value)} placeholder="Nom du conseiller" />
                </div>
              </div>

              <div className="form-row">
                <div className="form-group">
                  <label>Lien France Compétences</label>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <input value={form.franceCompetencesUrl} onChange={e => handleChange('franceCompetencesUrl', e.target.value)} placeholder="https://www.francecompetences.fr/..." style={{ flex: 1 }} />
                    {form.franceCompetencesUrl && (
                      <a href={form.franceCompetencesUrl} target="_blank" rel="noopener noreferrer" className="btn btn-sm btn-outline" style={{ whiteSpace: 'nowrap' }}>
                        <Icon name="external-link" size={12} /> Ouvrir
                      </a>
                    )}
                  </div>
                </div>
              </div>

              {/* === PIÈCES JOINTES === */}
              <div style={{ marginTop: 24 }}>
                <h3 style={{ fontSize: 14, fontWeight: 700, marginBottom: 12, color: '#0f172a' }}>Pièces jointes</h3>
                {!isEdit && (
                  <div style={{ background: '#fef3c7', color: '#92400e', padding: 10, borderRadius: 8, marginBottom: 12, fontSize: 12 }}>
                    💡 Sauvegardez d'abord la formation pour pouvoir ajouter des pièces jointes.
                  </div>
                )}
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 }}>
                  {renderPJZone('programme')}
                  {renderPJZone('calendrier')}
                  {renderPJZone('ficheProduit')}
                </div>
              </div>

              {/* === AUTRES DOCUMENTS === */}
              {isEdit && (
                <div style={{ marginTop: 24 }}>
                  <h3 style={{ fontSize: 14, fontWeight: 700, marginBottom: 12, color: '#0f172a' }}>Autres documents</h3>
                  {autresDocs.length > 0 && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 12 }}>
                      {autresDocs.map(doc => (
                        <div key={doc.id} style={{ background: '#f8fafc', borderRadius: 8, padding: 10, display: 'flex', alignItems: 'center', gap: 10, border: '1px solid #e2e8f0' }}>
                          <Icon name="file" size={16} color="#64748b" />
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 13, fontWeight: 600 }}>{doc.label}</div>
                            <div style={{ fontSize: 10, color: '#94a3b8' }}>{doc.originalName} · {fmtSize(doc.size || 0)}</div>
                          </div>
                          <button className="btn btn-sm" style={{ background: '#DDE04B', color: '#111', border: '1.5px solid #111', fontWeight: 700 }} onClick={() => downloadAttachment('autre', doc.id, doc.originalName)}>
                            <Icon name="download" size={12} /> Télécharger
                          </button>
                          <button className="btn btn-sm" style={{ background: '#fee2e2', color: '#991b1b', border: 'none' }} onClick={() => deleteAttachment('autre', doc.id)}>
                            <Icon name="trash" size={12} />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{ background: '#f8fafc', borderRadius: 8, padding: 12, border: '1px dashed #cbd5e1', display: 'flex', gap: 8, alignItems: 'center' }}>
                    <input value={newOtherLabel} onChange={e => setNewOtherLabel(e.target.value)} placeholder="Nom du document (ex: CGV, Tarif 2026)" style={{ flex: 1, fontSize: 13 }} />
                    <label className="btn btn-sm btn-outline" style={{ cursor: 'pointer', margin: 0, whiteSpace: 'nowrap' }}>
                      <Icon name="upload" size={12} /> Ajouter PDF
                      <input type="file" accept="application/pdf,.pdf" style={{ display: 'none' }} onChange={e => {
                        if (!newOtherLabel.trim()) { setError('Donnez d\'abord un nom au document'); return; }
                        uploadFile('autre', e.target.files[0], newOtherLabel.trim());
                        setNewOtherLabel('');
                      }} disabled={uploading === 'autre' + newOtherLabel} />
                    </label>
                  </div>
                </div>
              )}
            </div>

            <div className="modal-footer">
              <button className="btn btn-outline" onClick={onClose}>Annuler</button>
              <button className="btn btn-primary" onClick={handleSave} disabled={saving || !form.name.trim()}>
                {saving ? 'Sauvegarde...' : (isEdit ? 'Enregistrer' : 'Créer')}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============ STAR RATING ============
    function StarRating({ value = 0, onChange, size = 20, readOnly = false }) {
      const [hover, setHover] = useState(0);
      return (
        <div style={{ display: 'inline-flex', gap: 2, cursor: readOnly ? 'default' : 'pointer' }}>
          {[1, 2, 3, 4, 5].map(star => (
            <span
              key={star}
              onClick={() => !readOnly && onChange && onChange(star === value ? 0 : star)}
              onMouseEnter={() => !readOnly && setHover(star)}
              onMouseLeave={() => !readOnly && setHover(0)}
              style={{ fontSize: size, color: star <= (hover || value) ? '#DDE04B' : '#ddd', transition: 'color 0.15s', lineHeight: 1 }}
            >&#9733;</span>
          ))}
        </div>
      );
    }

    // ============ CANDIDATE DRAWER ============
    // ============ CANDIDATE DOCUMENTS (dossier d'admission) ============
    // Composant intégré au CandidateDrawer : photo + 9 docs standards + autres docs libres.
    function CandidateDocuments({ candidateId }) {
      const [docs, setDocs] = useState({ standards: {}, autres: [] });
      const [photoUrl, setPhotoUrl] = useState(null);
      const [uploading, setUploading] = useState(null);
      const [error, setError] = useState(null);
      const [newOtherLabel, setNewOtherLabel] = useState('');

      // Définition centralisée des 10 slots (photo + 9 standards)
      const SLOTS = [
        { type: 'photo',                  label: 'Photo',                   accept: 'image/jpeg,image/png,.jpg,.jpeg,.png',           help: 'JPG/PNG, max 5 Mo' },
        { type: 'identite_recto',         label: 'Identité — Recto',        accept: 'application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png', help: 'PDF/JPG/PNG' },
        { type: 'identite_verso',         label: 'Identité — Verso',        accept: 'application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png', help: 'PDF/JPG/PNG' },
        { type: 'releve_notes_n',         label: 'Relevé notes année en cours', accept: 'application/pdf,.pdf', help: 'PDF' },
        { type: 'releve_notes_n_minus_1', label: 'Relevé notes année précédente', accept: 'application/pdf,.pdf', help: 'PDF' },
        { type: 'dernier_diplome',        label: 'Dernier diplôme obtenu',  accept: 'application/pdf,.pdf', help: 'PDF' },
        { type: 'synthese_pro',           label: 'Synthèse pro',            accept: 'application/pdf,.pdf', help: 'PDF' },
        { type: 'test_entree',            label: 'Test d\'entrée / Questionnaire', accept: 'application/pdf,.pdf', help: 'PDF' },
        { type: 'carte_sejour',           label: 'Carte de séjour / Visa',  accept: 'application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png', help: 'PDF/JPG/PNG' },
        { type: 'cv',                     label: 'CV',                       accept: 'application/pdf,.pdf', help: 'PDF' },
      ];

      const loadDocs = useCallback(async () => {
        try {
          const r = await fetch('/parcoursup/api/candidates/' + candidateId + '/documents', {
            headers: { 'Authorization': 'Bearer ' + getToken() }
          });
          if (!r.ok) throw new Error('Erreur de chargement');
          const data = await r.json();
          setDocs(data);
          // Photo : charge en blob pour preview (auth requis)
          if (data.standards && data.standards.photo) {
            const pr = await fetch('/parcoursup/api/candidates/' + candidateId + '/documents/download/photo', {
              headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            if (pr.ok) {
              const blob = await pr.blob();
              setPhotoUrl(prev => { if (prev) URL.revokeObjectURL(prev); return URL.createObjectURL(blob); });
            }
          } else {
            setPhotoUrl(prev => { if (prev) URL.revokeObjectURL(prev); return null; });
          }
        } catch (e) { setError(e.message); }
      }, [candidateId]);

      useEffect(() => {
        loadDocs();
        return () => { if (photoUrl) URL.revokeObjectURL(photoUrl); };
      }, [candidateId]);

      const upload = async (type, file, label) => {
        if (!file) return;
        setError(null);
        setUploading(type + (label || ''));
        try {
          const fd = new FormData();
          fd.append('file', file);
          if (label) fd.append('label', label);
          const r = await fetch('/parcoursup/api/candidates/' + candidateId + '/documents/upload/' + type, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + getToken() },
            body: fd
          });
          const data = await r.json();
          if (!r.ok || data.error) throw new Error(data.error || 'Upload échoué');
          await loadDocs();
        } catch (e) { setError(e.message); }
        setUploading(null);
      };

      const removeDoc = async (type, docId) => {
        if (!confirm('Supprimer ce document ?')) return;
        try {
          const url = '/parcoursup/api/candidates/' + candidateId + '/documents/' + type + (docId ? '/' + docId : '');
          const r = await fetch(url, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getToken() }});
          if (!r.ok) throw new Error('Suppression échouée');
          await loadDocs();
        } catch (e) { setError(e.message); }
      };

      const download = async (type, docId, defaultName) => {
        try {
          const url = '/parcoursup/api/candidates/' + candidateId + '/documents/download/' + type + (docId ? '/' + docId : '');
          const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + getToken() }});
          if (!r.ok) throw new Error('Téléchargement échoué');
          const blob = await r.blob();
          const u = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = u; a.download = defaultName || 'document'; document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(u);
        } catch (e) { setError(e.message); }
      };

      const fmtSize = (s) => !s ? '' : (s < 1024 * 1024 ? Math.round(s / 1024) + ' Ko' : (s / 1024 / 1024).toFixed(1) + ' Mo');

      // Rendu d'un slot standard (non-photo)
      const renderSlot = (slot) => {
        const doc = docs.standards[slot.type];
        const busy = uploading === slot.type;
        return (
          <div key={slot.type} style={{ background: doc ? '#fafce0' : '#f8fafc', border: doc ? '1px solid #DDE04B' : '1px solid #e2e8f0', borderRadius: 10, padding: 10 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: '#0f172a', marginBottom: 6, lineHeight: 1.2 }}>{slot.label}</div>
            {doc ? (
              <>
                <div style={{ fontSize: 10, color: '#475569', marginBottom: 6, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }} title={doc.originalName}>{doc.originalName}{doc.size ? ' · ' + fmtSize(doc.size) : ''}</div>
                <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                  <button className="btn btn-sm" style={{ background: '#DDE04B', color: '#111', border: '1.5px solid #111', flex: 1, fontWeight: 700, fontSize: 11, padding: '4px 8px' }} onClick={() => download(slot.type, null, doc.originalName)}>
                    <Icon name="download" size={11} /> DL
                  </button>
                  <label className="btn btn-sm btn-outline" style={{ cursor: 'pointer', margin: 0, fontSize: 11, padding: '4px 8px' }} title="Remplacer">
                    <Icon name="upload" size={11} />
                    <input type="file" accept={slot.accept} style={{ display: 'none' }} onChange={e => upload(slot.type, e.target.files[0])} disabled={busy} />
                  </label>
                  <button className="btn btn-sm" style={{ background: '#fee2e2', color: '#991b1b', border: 'none', fontSize: 11, padding: '4px 8px' }} onClick={() => removeDoc(slot.type)} title="Supprimer">
                    <Icon name="trash" size={11} />
                  </button>
                </div>
              </>
            ) : (
              <label className="btn btn-sm btn-outline" style={{ cursor: 'pointer', width: '100%', justifyContent: 'center', fontSize: 11, padding: '6px 8px' }}>
                {busy ? '⏳ Upload...' : <><Icon name="upload" size={11} /> Ajouter</>}
                <input type="file" accept={slot.accept} style={{ display: 'none' }} onChange={e => upload(slot.type, e.target.files[0])} disabled={busy} />
              </label>
            )}
          </div>
        );
      };

      const standardSlotsExceptPhoto = SLOTS.filter(s => s.type !== 'photo');
      const photoSlot = SLOTS.find(s => s.type === 'photo');
      const filledCount = SLOTS.filter(s => docs.standards[s.type]).length + docs.autres.length;

      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
            <h3 style={{ margin: 0 }}>Dossier admission</h3>
            <span style={{ fontSize: 11, color: '#64748b', background: '#f1f5f9', padding: '3px 10px', borderRadius: 12, fontWeight: 700 }}>
              📎 {filledCount} document{filledCount > 1 ? 's' : ''}
            </span>
          </div>

          {error && (
            <div style={{ background: '#fee2e2', color: '#991b1b', padding: 8, borderRadius: 6, marginBottom: 10, fontSize: 12 }}>
              {error} <button style={{ marginLeft: 8, background: 'transparent', border: 'none', color: '#991b1b', cursor: 'pointer', textDecoration: 'underline' }} onClick={() => setError(null)}>OK</button>
            </div>
          )}

          {/* PHOTO + INFO */}
          <div style={{ display: 'flex', gap: 12, marginBottom: 14, alignItems: 'center', background: '#f8fafc', padding: 10, borderRadius: 10, border: '1px solid #e2e8f0' }}>
            <div style={{ position: 'relative', width: 76, height: 76, borderRadius: '50%', overflow: 'hidden', background: '#e2e8f0', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '3px solid white', boxShadow: '0 1px 4px rgba(0,0,0,0.1)' }}>
              {photoUrl ? (
                <img src={photoUrl} alt="Photo" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
              ) : (
                <Icon name="users" size={32} color="#94a3b8" />
              )}
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: '#0f172a', marginBottom: 4 }}>{photoSlot.label}</div>
              <div style={{ fontSize: 10, color: '#94a3b8', marginBottom: 6 }}>{photoSlot.help}</div>
              <div style={{ display: 'flex', gap: 6 }}>
                <label className="btn btn-sm btn-outline" style={{ cursor: 'pointer', margin: 0, fontSize: 11, padding: '4px 10px' }}>
                  {uploading === 'photo' ? '⏳' : <><Icon name="upload" size={11} /> {photoUrl ? 'Remplacer' : 'Ajouter'}</>}
                  <input type="file" accept={photoSlot.accept} style={{ display: 'none' }} onChange={e => upload('photo', e.target.files[0])} disabled={uploading === 'photo'} />
                </label>
                {photoUrl && (
                  <button className="btn btn-sm" style={{ background: '#fee2e2', color: '#991b1b', border: 'none', fontSize: 11, padding: '4px 8px' }} onClick={() => removeDoc('photo')}>
                    <Icon name="trash" size={11} />
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* GRILLE 9 SLOTS STANDARDS */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 8, marginBottom: 14 }}>
            {standardSlotsExceptPhoto.map(renderSlot)}
          </div>

          {/* AUTRES DOCUMENTS */}
          <div style={{ background: '#f8fafc', borderRadius: 10, padding: 10, border: '1px solid #e2e8f0' }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: '#0f172a', marginBottom: 8 }}>Autres documents</div>
            {docs.autres.length > 0 && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 8 }}>
                {docs.autres.map(doc => (
                  <div key={doc.id} style={{ background: 'white', borderRadius: 6, padding: 8, display: 'flex', alignItems: 'center', gap: 8, border: '1px solid #e2e8f0' }}>
                    <Icon name="file" size={14} color="#64748b" />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{doc.label}</div>
                      <div style={{ fontSize: 10, color: '#94a3b8' }}>{doc.originalName} · {fmtSize(doc.size)}</div>
                    </div>
                    <button className="btn btn-sm" style={{ background: '#DDE04B', color: '#111', border: '1.5px solid #111', fontWeight: 700, fontSize: 11, padding: '3px 8px' }} onClick={() => download('autre', doc.id, doc.originalName)}>
                      <Icon name="download" size={11} />
                    </button>
                    <button className="btn btn-sm" style={{ background: '#fee2e2', color: '#991b1b', border: 'none', fontSize: 11, padding: '3px 8px' }} onClick={() => removeDoc('autre', doc.id)}>
                      <Icon name="trash" size={11} />
                    </button>
                  </div>
                ))}
              </div>
            )}
            <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
              <input value={newOtherLabel} onChange={e => setNewOtherLabel(e.target.value)} placeholder="Nom du document..." style={{ flex: 1, fontSize: 12, padding: '6px 10px' }} />
              <label className="btn btn-sm btn-outline" style={{ cursor: newOtherLabel.trim() ? 'pointer' : 'not-allowed', margin: 0, fontSize: 11, padding: '6px 10px', opacity: newOtherLabel.trim() ? 1 : 0.5 }}>
                <Icon name="upload" size={11} /> Ajouter
                <input type="file" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" style={{ display: 'none' }} onChange={e => {
                  if (!newOtherLabel.trim()) return;
                  upload('autre', e.target.files[0], newOtherLabel.trim());
                  setNewOtherLabel('');
                  e.target.value = ''; // reset pour pouvoir re-uploader le même fichier
                }} disabled={!newOtherLabel.trim()} />
              </label>
            </div>
          </div>
        </div>
      );
    }

    function CandidateDrawer({ candidate, config, candidates, relances, onClose, onUpdate, onDelete, onAddRelance, onReloadRelances }) {
      const [form, setForm] = useState({ ...candidate });
      const [relanceForm, setRelanceForm] = useState({ type: 'telephone', notes: '', result: 'autre', createdBy: '' });
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
      const [showCourrier, setShowCourrier] = useState(false);
      const saveTimeoutRef = useRef(null);

      // === Message WhatsApp editable par etape ===
      // Template par defaut applique si aucun modele sauvegarde pour ce stage.
      const getDefaultWaTemplate = (cand) =>
        `Bonjour {{prenom}},\n\nNous échangeons à propos de votre candidature pour {{formation}} chez {{ecole}}.\n\nCordialement,\nService Admissions`;
      const stageTemplate = (config.individualWhatsappTemplates || {})[candidate.stage]
        || getDefaultWaTemplate(candidate);
      const [waMessage, setWaMessage] = useState(stageTemplate);
      const [sendingWa, setSendingWa] = useState(false);
      const [savingWaTemplate, setSavingWaTemplate] = useState(false);
      const [waResult, setWaResult] = useState(null);

      // Resynchronise le template a chaque changement de candidat OU de stage
      useEffect(() => {
        const t = (config.individualWhatsappTemplates || {})[candidate.stage] || getDefaultWaTemplate(candidate);
        setWaMessage(t);
        setWaResult(null);
      }, [candidate.id, candidate.stage]);

      // Resynchroniser le form quand on change de candidat (ou quand ses donnees sont mises a jour)
      useEffect(() => {
        setForm({ ...candidate });
      }, [candidate.id, candidate.updatedAt]);

      // Auto-save on form change (debounced)
      const handleChange = (field, value) => {
        const updated = { ...form, [field]: value };
        // Auto-fill conseiller when ecole + formation change
        if (field === 'ecole' || field === 'formation') {
          const ecole = field === 'ecole' ? value : form.ecole;
          const formation = field === 'formation' ? value : form.formation;
          if (ecole && formation && config.ecoles[ecole]?.formations[formation]) {
            updated.conseillerFormation = config.ecoles[ecole].formations[formation].conseiller || '';
          }
          if (field === 'ecole') updated.formation = '';
        }
        setForm(updated);
        if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
        saveTimeoutRef.current = setTimeout(() => onUpdate(candidate.id, updated), 800);
      };

      const handleAddRelance = () => {
        if (!relanceForm.type) return;
        onAddRelance({ ...relanceForm, candidateId: candidate.id });
        setRelanceForm({ type: 'telephone', notes: '', result: 'autre', createdBy: '' });
      };

      // === Handlers du message WhatsApp individuel ===
      const stageLabelForWa = (config.stages || []).find(s => s.id === candidate.stage)?.label || candidate.stage || '?';

      const handleSaveWaTemplate = async () => {
        setSavingWaTemplate(true);
        setWaResult(null);
        try {
          const newConfig = {
            ...config,
            individualWhatsappTemplates: {
              ...(config.individualWhatsappTemplates || {}),
              [candidate.stage]: waMessage
            }
          };
          await api('/config', { method: 'POST', body: newConfig });
          setWaResult({ ok: true, message: `Modele sauvegarde pour l'etape "${stageLabelForWa}"` });
        } catch (e) {
          setWaResult({ ok: false, message: 'Erreur sauvegarde : ' + (e.message || e) });
        }
        setSavingWaTemplate(false);
      };

      const handleSendWaIndividual = async () => {
        if (!waMessage.trim()) return;
        setSendingWa(true);
        setWaResult(null);
        try {
          const r = await api('/whatsapp/send-individual', {
            method: 'POST',
            body: { candidateId: candidate.id, message: waMessage }
          });
          if (r && r.ok) {
            setWaResult({ ok: true, message: `WhatsApp envoye a ${form.prenom || ''} ${form.nom || ''} (${form.telephone || ''})` });
            if (onReloadRelances) onReloadRelances();
          } else {
            setWaResult({ ok: false, message: 'Echec : ' + (r?.error || 'erreur inconnue') });
          }
        } catch (e) {
          setWaResult({ ok: false, message: 'Erreur reseau : ' + (e.message || e) });
        }
        setSendingWa(false);
      };

      const formations = form.ecole && config.ecoles[form.ecole]
        ? Object.keys(config.ecoles[form.ecole].formations)
        : [];

      const phoneClean = (form.telephone || '').replace(/\s/g, '').replace(/^0/, '+33');

      const sortedRelances = [...relances].sort((a, b) => new Date(b.date) - new Date(a.date));

      return (
        <>
          <div className="drawer-overlay" onClick={onClose} />
          <div className="drawer">
            <div className="drawer-header">
              <h2 style={{ fontSize: 18 }}>{form.prenom} {form.nom}</h2>
              <div style={{ display: 'flex', gap: 8 }}>
                <button className="btn btn-sm btn-danger" onClick={() => setShowDeleteConfirm(true)}>
                  <Icon name="trash" size={14} />
                </button>
                <button className="btn btn-sm btn-outline" onClick={onClose}>
                  <Icon name="x" size={14} />
                </button>
              </div>
            </div>

            <div className="drawer-body">
              {showDeleteConfirm && (
                <div style={{ background: '#fff3f3', padding: 16, borderRadius: 8, marginBottom: 16 }}>
                  <p style={{ fontSize: 13, marginBottom: 8 }}>Supprimer ce candidat et toutes ses relances ?</p>
                  <button className="btn btn-sm btn-danger" onClick={() => onDelete(candidate.id)} style={{ marginRight: 8 }}>Confirmer</button>
                  <button className="btn btn-sm btn-outline" onClick={() => setShowDeleteConfirm(false)}>Annuler</button>
                </div>
              )}

              <div className="drawer-section">
                <h3>Informations</h3>
                <div className="form-row">
                  <div className="form-group">
                    <label>Nom</label>
                    <input value={form.nom} onChange={e => handleChange('nom', e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label>Prénom</label>
                    <input value={form.prenom} onChange={e => handleChange('prenom', e.target.value)} />
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group" style={{ flex: '0 0 140px' }}>
                    <label>Genre</label>
                    <select value={form.genre || ''} onChange={e => handleChange('genre', e.target.value)}>
                      <option value="">--</option>
                      <option value="F">Fille</option>
                      <option value="G">Garçon</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label>Date de naissance</label>
                    <input type="date" value={form.dateNaissance || ''} onChange={e => handleChange('dateNaissance', e.target.value)} />
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label>Téléphone</label>
                    <input value={form.telephone} onChange={e => handleChange('telephone', e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label>Email</label>
                    <input value={form.email} onChange={e => handleChange('email', e.target.value)} />
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group" style={{ flex: 2 }}>
                    <label>Adresse postale</label>
                    <input value={form.adresse || ''} onChange={e => handleChange('adresse', e.target.value)} placeholder="N° et rue" />
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group" style={{ flex: '0 0 120px' }}>
                    <label>Code postal</label>
                    <input value={form.codePostal || ''} onChange={e => handleChange('codePostal', e.target.value)} placeholder="33000" maxLength={5} />
                  </div>
                  <div className="form-group">
                    <label>Ville</label>
                    <input value={form.ville || ''} onChange={e => handleChange('ville', e.target.value)} placeholder="Bordeaux" />
                  </div>

    function AddCandidateModal({ config, onClose, onAdd }) {
      // ecole auto-affectée à la 1re école dispo (CLEM en config CLEM mono-école)

      const defaultEcole = Object.keys(config.ecoles || {})[0] || '';
      // stage initial = 1re étape Kanban configurée (sinon le candidat n'apparaîtrait dans aucune colonne)
      const defaultStage = (config.stages && config.stages[0] && config.stages[0].id) || 'voeu_recu';
      const [form, setForm] = useState({
        numeroDossier: '', genre: '', dateNaissance: '',
        nom: '', prenom: '', telephone: '', email: '',
        adresse: '', codePostal: '', ville: '',
        ecole: defaultEcole, formation: '', chargeAdmission: '', conseillerFormation: '',
        stage: defaultStage, statutCRM: false, notes: ''
      });

      const handleChange = (field, value) => {
        const updated = { ...form, [field]: value };
        if (field === 'ecole' || field === 'formation') {
          const ecole = field === 'ecole' ? value : form.ecole;
          const formation = field === 'formation' ? value : form.formation;
          if (ecole && formation && config.ecoles[ecole]?.formations[formation]) {
            updated.conseillerFormation = config.ecoles[ecole].formations[formation].conseiller || '';
          }
          if (field === 'ecole') updated.formation = '';
        }
        setForm(updated);
      };

      const formations = form.ecole && config.ecoles[form.ecole]
        ? Object.keys(config.ecoles[form.ecole].formations)
        : [];

      const handleSubmit = () => {
        if (!form.nom || !form.prenom) return alert('Nom et prénom requis');
        onAdd(form);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>

                  <label>Genre</label>
                  <select value={form.genre} onChange={e => handleChange('genre', e.target.value)}>
                    <option value="">--</option>
                    <option value="F">Fille</option>
                    <option value="G">Garçon</option>
                  </select>

                <div className="form-group">
                  <label>Date de naissance</label>

                </div>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label>Téléphone</label>
