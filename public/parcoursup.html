    // ============ STAGE MANAGER MODAL ============
    function StageManagerModal({ config, candidates, onClose, onSave }) {
      const [stages, setStages] = useState(config.stages.map(s => ({ ...s })));
      const [newName, setNewName] = useState('');
      const [newColor, setNewColor] = useState('#3498DB');
      const [editingColorIdx, setEditingColorIdx] = useState(null);

      const PALETTE = ['#9B59B6', '#3498DB', '#F39C12', '#2ECC71', '#27AE60', '#E74C3C', '#95A5A6', '#1ABC9C', '#E91E63', '#FF5722', '#607D8B', '#795548', '#1a1a1a', '#00BCD4'];

      // Count candidates per stage
      const candidateCount = (stageId) => candidates.filter(c => c.stage === stageId).length;

      // Rename — bloqué pour les colonnes locked (ex: SAS ENTRÉE)
      const handleRename = (idx, newLabel) => {
        if (stages[idx].locked) return;
        const updated = [...stages];
        updated[idx] = { ...updated[idx], label: newLabel };
        setStages(updated);
      };

      // Move up — bloqué si la cible (idx-1) est locked, pour garder la locked en position 0
      const handleMoveUp = (idx) => {
        if (idx <= 0) return;
        if (stages[idx].locked) return;
        if (stages[idx - 1] && stages[idx - 1].locked) return;
        const updated = [...stages];
        [updated[idx - 1], updated[idx]] = [updated[idx], updated[idx - 1]];
        updated.forEach((s, i) => s.order = i);
        setStages(updated);
      };

      // Move down — bloqué pour les colonnes locked
      const handleMoveDown = (idx) => {
        if (idx >= stages.length - 1) return;
        if (stages[idx].locked) return;
        const updated = [...stages];
        [updated[idx], updated[idx + 1]] = [updated[idx + 1], updated[idx]];
        updated.forEach((s, i) => s.order = i);
        setStages(updated);
      };

      // Delete — bloqué pour les colonnes locked
      const handleDelete = (idx) => {
        const stage = stages[idx];
        if (stage.locked) {
          alert(`La colonne "${stage.label}" est verrouillée : elle reçoit toujours les nouveaux candidats (création manuelle ou import CSV).`);
          return;
        }
        const count = candidateCount(stage.id);
        if (count > 0) {
          alert(`Impossible de supprimer "${stage.label}" : ${count} candidat(s) sont dans cette colonne. Déplacez-les d'abord.`);
          return;
        }
        if (!confirm(`Supprimer la colonne "${stage.label}" ?`)) return;
        const updated = stages.filter((_, i) => i !== idx);
        updated.forEach((s, i) => s.order = i);
        setStages(updated);
      };

      // Change color
      const handleColorChange = (idx, color) => {
        const updated = [...stages];
        updated[idx] = { ...updated[idx], color };
        setStages(updated);
        setEditingColorIdx(null);
      };

      // Add new stage
      const handleAdd = () => {
        if (!newName.trim()) return;
        const id = newName.trim().toLowerCase()
          .replace(/[éèêë]/g, 'e').replace(/[àâä]/g, 'a').replace(/[ùûü]/g, 'u').replace(/[ôö]/g, 'o').replace(/[îï]/g, 'i').replace(/ç/g, 'c')
          .replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
        if (stages.find(s => s.id === id)) {
          alert('Une colonne avec cet identifiant existe déjà.');
          return;
        }
        setStages([...stages, { id, label: newName.trim(), color: newColor, order: stages.length }]);
        setNewName('');
        setNewColor('#3498DB');
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{ width: 600 }}>
            <div className="modal-header">
              <h2><Icon name="settings" size={20} /> Gérer les colonnes Kanban</h2>
              <button className="btn btn-icon btn-outline" onClick={onClose}><Icon name="x" size={18} /></button>
            </div>
            <div className="modal-body">
              <p style={{ fontSize: 13, color: '#888', marginBottom: 16 }}>
                Réorganisez, renommez, ajoutez ou supprimez les colonnes du Kanban. Les colonnes contenant des candidats ne peuvent pas être supprimées.
              </p>

              <div className="stage-manager-list">
                {stages.map((stage, idx) => {
                  const isLocked = !!stage.locked;
                  const upDisabled = idx === 0 || (stages[idx - 1] && stages[idx - 1].locked) || isLocked;
                  const downDisabled = idx === stages.length - 1 || isLocked;
                  return (
                  <div key={stage.id} className="stage-manager-item" style={isLocked ? { background: '#fafce0', borderColor: '#DDE04B' } : {}}>
                    <div className="grip" title={isLocked ? 'Colonne verrouillée en position 1' : 'Position'} style={isLocked ? { color: '#0f172a' } : {}}>
                      <Icon name={isLocked ? 'settings' : 'grip-vertical'} size={16} />
                    </div>

                    <div
                      className="color-dot"
                      style={{ background: stage.color, opacity: isLocked ? 0.6 : 1, cursor: isLocked ? 'not-allowed' : 'pointer' }}
                      title={isLocked ? 'Couleur figée (colonne verrouillée)' : 'Changer la couleur'}
                      onClick={() => !isLocked && setEditingColorIdx(editingColorIdx === idx ? null : idx)}
                    />

                    <input
                      className="stage-name-input"
                      value={stage.label}
                      onChange={e => handleRename(idx, e.target.value)}
                      placeholder="Nom de la colonne"
                      disabled={isLocked}
                      title={isLocked ? 'Nom figé (colonne verrouillée)' : ''}
                      style={isLocked ? { color: '#475569', fontWeight: 800, background: 'transparent', cursor: 'not-allowed' } : {}}
                    />

                    {isLocked && (
                      <span style={{ fontSize: 10, fontWeight: 800, background: '#0f172a', color: '#DDE04B', padding: '3px 8px', borderRadius: 6, letterSpacing: 0.5 }} title="Reçoit toujours les nouveaux candidats (création manuelle + import CSV)">
                        🔒 ENTRÉE
                      </span>
                    )}

                    <span style={{ fontSize: 11, color: '#aaa', minWidth: 30, textAlign: 'center' }}>
                      {candidateCount(stage.id) > 0 ? `${candidateCount(stage.id)}` : '0'}
                    </span>

                    <div className="stage-manager-actions">
                      <button onClick={() => handleMoveUp(idx)} disabled={upDisabled} title={isLocked ? 'Verrouillée' : 'Monter'}>
                        <Icon name="arrow-up" size={14} />
                      </button>
                      <button onClick={() => handleMoveDown(idx)} disabled={downDisabled} title={isLocked ? 'Verrouillée' : 'Descendre'}>
                        <Icon name="arrow-down" size={14} />
                      </button>
                      <button className="danger" onClick={() => handleDelete(idx)} disabled={isLocked} title={isLocked ? 'Verrouillée — non supprimable' : 'Supprimer'}>
                        <Icon name="trash" size={14} />
                      </button>
                    </div>

                    {editingColorIdx === idx && (
                      <div className="color-picker-row" style={{ position: 'absolute', marginTop: 50, zIndex: 10, background: 'white', padding: 10, borderRadius: 10, boxShadow: '0 4px 16px rgba(0,0,0,0.15)' }}>
                        {PALETTE.map(c => (
                          <div
                            key={c}
                            className={`color-option ${stage.color === c ? 'selected' : ''}`}
                            style={{ background: c }}
                            onClick={() => handleColorChange(idx, c)}
                          />
                        ))}
                      </div>
                    )}
                  </div>
                  );
                })}
              </div>

              <div className="stage-add-bar">
                <div
                  className="color-dot"
                  style={{ background: newColor, width: 32, height: 32, borderRadius: '50%', border: '2px solid white', boxShadow: '0 0 0 1px #ddd', cursor: 'pointer', flexShrink: 0 }}
                  onClick={() => {
                    const idx = PALETTE.indexOf(newColor);
                    setNewColor(PALETTE[(idx + 1) % PALETTE.length]);
                  }}
                  title="Cliquez pour changer la couleur"
                />
                <input
                  value={newName}
                  onChange={e => setNewName(e.target.value)}
                  placeholder="Nom de la nouvelle colonne..."
                  style={{ flex: 1, padding: '8px 12px', border: '1.5px solid #ddd', borderRadius: 8, fontSize: 14 }}
                  onKeyDown={e => { if (e.key === 'Enter') handleAdd(); }}
                />
                <button className="btn btn-primary" onClick={handleAdd} disabled={!newName.trim()}>
                  <Icon name="plus" size={14} /> Ajouter
                </button>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-outline" onClick={onClose}>Annuler</button>
              <button className="btn btn-success" onClick={() => onSave(stages)}>
                <Icon name="check" size={14} /> Enregistrer
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============ CSV IMPORT MODAL ============
    function CSVImportModal({ config, onClose, onImport }) {
      const [step, setStep] = useState(1); // 1: upload, 2: mapping, 3: preview
      const [csvData, setCsvData] = useState(null);
      const [headers, setHeaders] = useState([]);
      const [mapping, setMapping] = useState({});
      const [preview, setPreview] = useState([]);
      const fileRef = useRef(null);

      const targetFields = [
        { key: 'nom', label: 'Nom' },
        { key: 'prenom', label: 'Prénom' },
        { key: 'numeroDossier', label: 'N° Candidat' },
        { key: 'genre', label: 'Genre' },
        { key: 'dateNaissance', label: 'Date de naissance' },
        { key: 'telephone', label: 'Téléphone' },
        { key: 'email', label: 'Email' },
        { key: 'adresse', label: 'Adresse postale' },
        { key: 'codePostal', label: 'Code postal' },
        { key: 'ville', label: 'Ville' },
        { key: 'ecole', label: 'École' },
        { key: 'formation', label: 'Formation' },
        { key: 'chargeAdmission', label: 'Chargé admission' },
        { key: 'conseillerFormation', label: 'Conseiller formation' },
      ];

      // Detection automatique de l'encodage: UTF-8 par defaut, fallback Windows-1252
      // Resout le probleme classique des exports Excel Windows (CSV en cp1252)
      // qui affichent "SAINT-ANDRÉ" comme "SAINT-ANDR?" une fois importes.
      const readFileWithEncoding = async (file) => {
        const buffer = await file.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        // Detection BOM UTF-8 (EF BB BF)
        if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
          return new TextDecoder('utf-8').decode(buffer.slice(3));
        }
        // Essai UTF-8 strict : si accents casses, fallback Windows-1252
        try {
          const utf8Text = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
          return utf8Text;
        } catch (e) {
          // Fichier Excel Windows : decodage en Windows-1252
          return new TextDecoder('windows-1252').decode(buffer);
        }
      };

      const handleFile = async (file) => {
        const text = await readFileWithEncoding(file);
        Papa.parse(text, {
          header: true,
          skipEmptyLines: true,
          complete: (result) => {
            setCsvData(result.data);
            setHeaders(result.meta.fields || []);
            // Auto-map by name similarity (insensible aux accents et ponctuation)
            const clean = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
            const autoMap = {};
            targetFields.forEach(tf => {
              const cleanKey = clean(tf.key);
              const cleanLabel = clean(tf.label);
              const match = (result.meta.fields || []).find(h => {
                const ch = clean(h);
                return ch.includes(cleanKey) || cleanKey.includes(ch) || ch.includes(cleanLabel) || cleanLabel.includes(ch);
              });
              if (match) autoMap[tf.key] = match;
            });
            setMapping(autoMap);
            setStep(2);
          }
        });
      };

      const handleDrop = (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
      };

      // Normalisation du genre : accepte plusieurs formats et retourne F ou G
      const normalizeGender = (val) => {
        const v = (val || '').toString().toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f\.]/g, '');
        if (!v) return '';
        // Valeurs feminines (verifie en premier car "Mme"/"Madame"/"Mlle" commencent par 'm')
        const fList = ['f', 'fille', 'femme', 'feminin', 'fem', 'female', 'mme', 'madame', 'mlle', 'mademoiselle'];
        if (fList.includes(v) || v.startsWith('fem') || v.startsWith('fill') || v.startsWith('mme') || v.startsWith('mlle') || v.startsWith('madame') || v.startsWith('mademoiselle')) return 'F';
        // Valeurs masculines
        const gList = ['g', 'h', 'm', 'garcon', 'homme', 'masculin', 'masc', 'male', 'mr', 'monsieur'];
        if (gList.includes(v) || v.startsWith('gar') || v.startsWith('hom') || v.startsWith('masc') || v.startsWith('monsieur') || v === 'mr' || v === 'm') return 'G';
        return '';
      };

      // Conversion des dates : accepte DD/MM/YYYY, DD-MM-YYYY, YYYY-MM-DD, DD/MM/YY
      const convertDate = (val) => {
        if (!val) return '';
        const v = val.toString().trim();
        // YYYY-MM-DD (format natif input[type=date])
        if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
        // DD/MM/YYYY ou DD-MM-YYYY ou DD.MM.YYYY
        let m = /^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/.exec(v);
        if (m) {
          const day = m[1].padStart(2, '0'), month = m[2].padStart(2, '0');
          return `${m[3]}-${month}-${day}`;
        }
        // DD/MM/YY (annee a 2 chiffres : < 30 = 2000s, >= 30 = 1900s)
        m = /^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2})$/.exec(v);
        if (m) {
          const day = m[1].padStart(2, '0'), month = m[2].padStart(2, '0');
          const year = parseInt(m[3], 10);
          const fullYear = year < 30 ? 2000 + year : 1900 + year;
          return `${fullYear}-${month}-${day}`;
        }
        // YYYY/MM/DD
        m = /^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/.exec(v);
        if (m) {
          return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
        }
        return '';
      };

      const generatePreview = () => {
        const mapped = csvData.map(row => {
          const candidate = {};
          targetFields.forEach(tf => {
            const raw = mapping[tf.key] ? (row[mapping[tf.key]] || '').trim() : '';
            if (tf.key === 'genre') {
              candidate[tf.key] = normalizeGender(raw);
            } else if (tf.key === 'dateNaissance') {
              candidate[tf.key] = convertDate(raw);
            } else if (tf.key === 'numeroDossier') {
              // Retirer les caracteres non numeriques et limiter a 6
              candidate[tf.key] = raw.replace(/\D/g, '').slice(0, 6);
            } else {
              candidate[tf.key] = raw;
            }
          });
          if (!candidate.conseillerFormation && candidate.ecole && candidate.formation && config.ecoles[candidate.ecole]?.formations[candidate.formation]) {
            candidate.conseillerFormation = config.ecoles[candidate.ecole].formations[candidate.formation].conseiller || '';
          }
          return candidate;
        }).filter(c => c.nom || c.prenom);
        setPreview(mapped);
        setStep(3);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2>Importer un fichier CSV</h2>
              <button className="btn btn-icon btn-outline" onClick={onClose}><Icon name="x" size={18} /></button>
            </div>
            <div className="modal-body">
              {step === 1 && (
                <>
                  <div
                    className="dropzone"
                    onDrop={handleDrop}
                    onDragOver={e => e.preventDefault()}
                    onClick={() => fileRef.current?.click()}
                  >
                    <Icon name="upload" size={40} color="#1a1a1a" />
                    <p style={{ marginTop: 12 }}>Glissez votre fichier CSV ici ou cliquez pour sélectionner</p>
                    <p style={{ fontSize: 12, color: '#aaa', marginTop: 4 }}>Format CSV avec en-têtes (séparateur , ou ;)</p>
                    <input
                      ref={fileRef}
                      type="file"
                      accept=".csv,.txt"
                      style={{ display: 'none' }}
                      onChange={e => { if (e.target.files[0]) handleFile(e.target.files[0]); }}
                    />
                  </div>
                  <div style={{ textAlign: 'center', marginTop: 12 }}>
                    <a href="/parcoursup/assets/modele-import-parcoursup.csv" download style={{ fontSize: 13, color: '#1a1a1a', textDecoration: 'underline', cursor: 'pointer' }}>
                      <Icon name="download" size={13} /> Télécharger la maquette CSV
                    </a>
                  </div>
                </>
              )}

              {step === 2 && (
                <>
                  <p style={{ marginBottom: 16, fontSize: 14 }}><strong>{csvData.length}</strong> lignes détectées. Mappez les colonnes :</p>
                  {targetFields.map(tf => (
                    <div key={tf.key} className="mapping-row">
                      <span className="csv-col">{tf.label}</span>
                      <span style={{ color: '#aaa' }}>←</span>
                      <select
                        value={mapping[tf.key] || ''}
                        onChange={e => setMapping(m => ({ ...m, [tf.key]: e.target.value }))}
                        style={{ flex: 1, padding: '6px 10px', borderRadius: 6, border: '1.5px solid #ddd' }}
                      >
                        <option value="">-- Ignorer --</option>
                        {headers.map(h => <option key={h} value={h}>{h}</option>)}
                      </select>
                    </div>
                  ))}
                </>
              )}

              {step === 3 && (
                <>
                  <p style={{ marginBottom: 16, fontSize: 14 }}>
                    <strong>{preview.length}</strong> candidats prêts à importer (stage: SAS ENTRÉE)
                  </p>
                  <div className="preview-table">
                    <table>
                      <thead>
                        <tr>
                          <th>Nom</th><th>Prénom</th><th>Email</th><th>Tél</th><th>Formation</th>
                        </tr>
                      </thead>
                      <tbody>
                        {preview.slice(0, 15).map((c, i) => (
                          <tr key={i}>
                            <td>{c.nom}</td><td>{c.prenom}</td><td>{c.email}</td><td>{c.telephone}</td><td>{c.formation}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    {preview.length > 15 && <p style={{ textAlign: 'center', color: '#888', padding: 8 }}>... et {preview.length - 15} de plus</p>}
                  </div>
                </>
              )}
            </div>
            <div className="modal-footer">
              {step > 1 && (
                <button className="btn btn-outline" onClick={() => setStep(s => s - 1)}>Retour</button>
              )}
              <button className="btn btn-outline" onClick={onClose}>Annuler</button>
              {step === 2 && (
                <button className="btn btn-primary" onClick={generatePreview}>Prévisualiser</button>
              )}
              {step === 3 && (
                <button className="btn btn-success" onClick={() => onImport(preview)}>
                  <Icon name="check" size={14} /> Importer {preview.length} candidats
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============ HELPERS ============
    function timeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return `${mins}min`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours}h`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days}j`;
      return `${Math.floor(days / 7)}sem`;
    }

    // ============ RENDER ============
    ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper />);
  </script>
</body>
</html>
